name: AX3800 Lorenzo

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  REMOTE_REPOSITORY: openwrt/openwrt
  REMOTE_BRANCH: main_nss
  REMOTE_TAG: v23.05.4
  CONFIG_FILE: configs/bpir3.config
  #NSS_STATUS_PATCH_PATH: configs/ax3600/patches
  #NSS_STATUS_PATCH: 999-add-nss-load-to-status.patch
  #CUSTOM_FILES_PATH: configs/ax3600/files/
  RELEASE_PREFIX: mediatek-filogic-bananapi_bpi-r3
  #NSS_PACKAGES_REPOSITORY: qosmio/nss-packages
  #NSS_PACKAGES_REPOSITORY_BRANCH: NSS-12.5-K6.x

jobs:

  build:
    name: Build OpenWrt
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget
      - name: Checkout remote repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REMOTE_REPOSITORY }}
          ref: ${{ env.REMOTE_TAG }}
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          path: "custom_repo"
      - name: Cache 
        uses: klever1988/cachewrtbuild@main
        with:
          ccache: 'true'
          prefix: ${{ github.workspace }}
      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Configure firmware image
        run: |
          mv custom_repo/${{ env.CONFIG_FILE }} .config
          make defconfig -j$(nproc)
      - name: Download package sources
        run: make download V=s
      - name: Build tools
        run: |
          make tools/install -j$(nproc) V=s || \
          make tools/install V=s

      - name: Build toolchain
        run: |
          make toolchain/install -j$(nproc) V=s || \
          make toolchain/install V=s

      - name: Build target images
        run: |
          make -j$(nproc) V=s || \
          make V=s